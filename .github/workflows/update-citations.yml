name: Update citation count

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation stats from OpenAlex
        env:
          OPENALEX_AUTHOR_ID: ${{ vars.OPENALEX_AUTHOR_ID }}
        run: python3 scripts/update_citations.py

      - name: Commit updated data if changed
        run: |
          if git diff --quiet -- data/citations.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/citations.json
          git commit -m "Update citation count [skip ci]"
          git push
